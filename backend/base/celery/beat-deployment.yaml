apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: beat
  template:
    metadata:
      labels:
        app: celery
        component: beat
    spec:
      serviceAccountName: blog-post-service-account
      containers:
        - name: celery-beat
          image: backend-image
          imagePullPolicy: IfNotPresent
          args: ["/app/entrypoints/beat.sh"]
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "400m"
