apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: beat
  template:
    metadata:
      labels:
        app: celery
        component: beat
    spec:
      containers:
        - name: beat
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sleep 3600
