apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    vault-access: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: worker
  template:
    metadata:
      labels:
        app: celery
        component: worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: "auth/blog-post-kubernetes"
        vault.hashicorp.com/agent-inject-token-audience: "vault"
    spec:
      serviceAccountName: blog-backend
      containers:
        - name: celery-worker
          image: backend-image
          imagePullPolicy: IfNotPresent
          args: ["/app/entrypoints/worker.sh"]

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  celery -A core inspect ping
                  --destination="celery@${HOSTNAME}"
                  --timeout=5
                  | grep -q pong
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  celery -A core inspect ping
                  --destination="celery@${HOSTNAME}"
                  --timeout=5
                  | grep -q pong
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 1"
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"
