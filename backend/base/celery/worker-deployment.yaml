apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: worker
  template:
    metadata:
      labels:
        app: celery
        component: worker
        vault-access: backend
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/auth-path: "auth/blog-post-kubernetes"
      vault.hashicorp.com/agent-inject-token-audience: "vault"
    spec:
      serviceAccountName: blog-backend
      containers:
        - name: celery-worker
          image: backend-image
          imagePullPolicy: IfNotPresent
          args: ["/app/entrypoints/worker.sh"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "200m"
