apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: worker
  template:
    metadata:
      labels:
        app: celery
        component: worker
    spec:
      containers:
        - name: celery-worker
          image: backend-image
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "400m"
