apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: blog
  labels:
    vault-access: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        vault-access: redis
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: "auth/blog-post-kubernetes"
        vault.hashicorp.com/agent-inject-token-audience: "vault"
    spec:
      serviceAccountName: blog-redis
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "200m"

