apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    vault-access: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: "auth/blog-post-kubernetes"
        vault.hashicorp.com/agent-inject-token-audience: "vault"
    spec:
      serviceAccountName: blog-backend
      containers:
        - name: backend
          image: backend-image
          imagePullPolicy: IfNotPresent
          args: ["/app/entrypoints/django.sh"]
          ports:
            - containerPort: 8000
          
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          startupProbe:
            httpGet:
              path: /health/startup/
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
            
          livenessProbe:
            httpGet:
              path: /health/live/
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
