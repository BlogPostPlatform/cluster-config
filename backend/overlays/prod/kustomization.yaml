apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-prod

resources:
  - ../../base

patches:
  - path: patch-deployment.yaml

  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: vault-access=backend
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1role
        value: blog-prod-backend
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-backend.env
        value: blog-post/data/prod/backend

      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-backend.env
        value: |
          {{- with secret "blog-post/data/prod/backend" -}}
          {{- range $key, $value := .Data.data }}
          {{ $key }}={{ $value }}
          {{- end }}
          {{- end }}

  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: vault-access=redis
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1role
        value: blog-prod-redis
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-redis.env
        value: blog-post/data/prod/redis

      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-redis.env
        value: |
          {{- with secret "blog-post/data/prod/redis" -}}
          {{- range $key, $value := .Data.data }}
          {{ $key }}={{ $value }}
          {{- end }}
          {{- end }}

  - target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: vault-access=postgres
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1role
        value: blog-prod-postgres
      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-postgres.env
        value: blog-post/data/prod/postgres

      - op: add
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-postgres.env
        value: |
          {{- with secret "blog-post/data/prod/postgres" -}}
          {{- range $key, $value := .Data.data }}
          {{ $key }}={{ $value }}
          {{- end }}
          {{- end }}

images:
- name: backend-image
  newName: ghcr.io/blogpostplatform/backend
  newTag: 40a3009fecc0ab74dd341978ee9f37ddf8771742
