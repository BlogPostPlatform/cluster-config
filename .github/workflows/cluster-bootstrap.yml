name: Initial Cluster Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: Apply prerequisites to the shared Kubernetes cluster
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cluster-bootstrap-shared
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Apply shared cluster prerequisites
    if: ${{ inputs.confirm_bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VAULT_CHART_VERSION: "0.34.0"
      EXTERNAL_VAULT_ADDR: ${{ vars.EXTERNAL_VAULT_ADDR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -d -m 700 "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Show namespace changes
        shell: bash
        run: |
          set +e
          kubectl diff -f namespaces.yaml
          diff_status=$?
          set -e

          if [[ "$diff_status" -gt 1 ]]; then
            exit "$diff_status"
          fi

      # Namespaced resources cannot be server-side dry-run until their target
      # namespaces exist. Reconcile namespaces before diffing the full bundle.
      - name: Ensure target namespaces exist
        run: kubectl apply -f namespaces.yaml
      
      - name: Create GHCR pull secrets
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$GHCR_USERNAME"
          test -n "$GHCR_PULL_TOKEN"

          for namespace in blog-dev blog-stage blog-prod; do
            kubectl create secret docker-registry ghcr-pull \
              --namespace="$namespace" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client \
              --output=yaml |
              kubectl apply -f -
          done

      - name: Render cluster prerequisites
        run: kubectl kustomize . > /tmp/cluster-prerequisites.yaml

      - name: Show remaining changes
        shell: bash
        run: |
          set +e
          kubectl diff -f /tmp/cluster-prerequisites.yaml
          diff_status=$?
          set -e

          if [[ "$diff_status" -gt 1 ]]; then
            exit "$diff_status"
          fi

      - name: Apply cluster prerequisites
        run: kubectl apply -f /tmp/cluster-prerequisites.yaml

      - name: Wait for reviewer token
        run: |
          kubectl wait \
            --for=jsonpath='{.data.token}' \
            secret/vault-token-reviewer \
            --namespace=vault-system \
            --timeout=60s

      - name: Verify reviewer authorization
        run: |
          result="$(kubectl auth can-i \
            create tokenreviews.authentication.k8s.io \
            --as=system:serviceaccount:vault-system:vault-token-reviewer)"

          test "$result" = "yes"
      
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      
      - name: Validate Vault configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXTERNAL_VAULT_ADDR"

      - name: Add HashiCorp Helm repository
        shell: bash
        run: |
          set -euo pipefail
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update
      
      - name: Reconcile Vault injector
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install vault hashicorp/vault \
          --version "$VAULT_CHART_VERSION" \
          --namespace vault-system \
          --set-string "global.externalVaultAddr=$EXTERNAL_VAULT_ADDR" \
          --values vault-injector-values.yaml \
          --atomic \
          --wait \
          --timeout 5m

      - name: Verify Vault injector
        shell: bash
        run: |
          set -euo pipefail
          helm status vault --namespace vault-system
          kubectl rollout status \
            deployment/vault-agent-injector \
            --namespace vault-system \
            --timeout=180s
          kubectl get mutatingwebhookconfiguration vault-agent-injector-cfg

      - name: Write summary
        run: |
          {
            echo "## Shared cluster bootstrap completed"
            echo
            echo '- Root Kubernetes prerequisites were reconciled.'
            echo '- The Vault reviewer Secret is populated.'
            echo '- The reviewer can create TokenReview requests.'
            echo '- No reviewer JWT was read or printed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
