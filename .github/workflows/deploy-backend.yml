name: Backend Infrastructure Pipeline

on:
  push:
    branches:
      - main

    paths:
      - 'backend/overlays/**/kustomization.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: environment
jobs:

  validate:
    name: Validate Kubernetes Manifests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render manifests (kustomize)
        run: |
          kubectl kustomize backend/overlays/${{ github.event.inputs.environment }} > /tmp/manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate manifests (kubeconform)
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /tmp/manifests.yaml


  scan:
    name: Security Scan Kubernetes Manifests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render manifests (kustomize)
        run: |
          kubectl kustomize backend/overlays/${{ inputs.environment }} > /tmp/manifests.yaml

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/manifests.yaml
          format: table
          exit-code: 0


  deploy:
    name: Deploy to K3s Cluster

    environment: prod

    runs-on: ubuntu-latest

    needs:
      - validate
      - scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Show diff
        run: |
          kubectl diff -k backend/overlays/${{ inputs.environment }} || true

      -  run: |
          cp -r backend/overlays/${{ inputs.environment }} /tmp/backend-prod

          find /tmp/backend-prod -type f -name "*.yml" -exec sh -c '
            envsubst < "$1" > "$1.tmp" && mv "$1.tmp" "$1"
          ' _ {} \;

      - name: Deploy backend stack
        run: |
          kubectl apply -k /tmp/backend-prod

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n blog --timeout=180s