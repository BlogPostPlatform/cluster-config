name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/overlays/*/kustomization.yaml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Existing frontend overlay to reconcile
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.target.outputs.environments }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve changed overlay
        id: target
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.target_environment }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            targets=("$REQUESTED_ENVIRONMENT")
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git show --pretty='' --name-only "$GITHUB_SHA")"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            fi

            mapfile -t targets < <(
              printf '%s\n' "$changed_files" |
                sed -nE 's#^frontend/overlays/(dev|stage|prod)/kustomization\.yaml$#\1#p' |
                sort -u
            )

            if [[ "${#targets[@]}" -eq 0 ]]; then
              echo "No changed frontend overlay was found." >&2
              exit 1
            fi
          fi

          for target in "${targets[@]}"; do
            case "$target" in
              dev|stage|prod) ;;
              *) echo "Unsupported environment: $target" >&2; exit 1 ;;
            esac
          done

          environments="$(printf '%s\n' "${targets[@]}" | jq --raw-input . | jq --slurp --compact-output .)"
          echo "environments=$environments" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.environment }} manifests
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    env:
      OVERLAY_PATH: frontend/overlays/${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Render manifests
        run: kubectl kustomize "$OVERLAY_PATH" > rendered-frontend.yaml

      - name: Install kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar --extract --gzip --directory /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            rendered-frontend.yaml

  scan:
    name: Scan ${{ matrix.environment }} manifests
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    env:
      OVERLAY_PATH: frontend/overlays/${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Render manifests
        run: kubectl kustomize "$OVERLAY_PATH" > rendered-frontend.yaml

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered-frontend.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

  deploy:
    name: Deploy frontend to ${{ matrix.environment }}
    needs:
      - resolve
      - validate
      - scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: frontend-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      OVERLAY_PATH: frontend/overlays/${{ matrix.environment }}
      TARGET_NAMESPACE: blog-${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          install -d -m 700 "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify target namespace
        run: kubectl get namespace "$TARGET_NAMESPACE"

      - name: Show changes
        shell: bash
        run: |
          set +e
          kubectl diff -k "$OVERLAY_PATH"
          diff_status=$?
          set -e

          if [[ "$diff_status" -gt 1 ]]; then
            exit "$diff_status"
          fi

      - name: Apply frontend overlay
        run: kubectl apply -k "$OVERLAY_PATH"

      - name: Verify frontend rollout
        run: kubectl rollout status deployment/title -n "$TARGET_NAMESPACE" --timeout=120s
